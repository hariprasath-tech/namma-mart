[project]
name = "localkart-ml"
version = "3.0.0"
description = "LocalKart Hyperlocal ML Microservice for Shelf, Crowd, Forecast, and Basket Insights (TRL 3)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "mlxtend>=0.23.1",
    "shapely>=2.0.3",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "pillow>=10.2.0",
    "pyyaml>=6.0.1",
    "jsonschema>=4.21.1",
    "pytest>=8.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

